[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-ucihar"
version = "1.1.13"
description = "Federated Human Activity Recognition with PyTorch and Flower"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.36.0",
    "numpy",
    "torch==2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.36.0"

[tool.flwr.app.components]
serverapp = "uciharapp.server_app:app"
clientapp = "uciharapp.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-evaluate = 1.0
local-epochs = 2
learning-rate = 0.003
batch-size = 32
save-model = true
dataset-dir = "D:\\Data\\Engenharia\\fldemo\\quickstart-ucihar\\data\\UCI HAR Dataset"
